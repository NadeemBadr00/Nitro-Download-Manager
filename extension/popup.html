<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 320px;
            padding: 16px;
            font-family: 'Inter', system-ui, sans-serif;
            background: hsl(0, 0%, 7%);
            color: hsl(216, 12%, 92%);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid hsl(214, 5%, 25%);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            color: hsl(218, 89%, 73%);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: hsl(140, 37%, 65%);
        }
        .status-badge {
            font-size: 0.72rem;
            color: hsl(0, 0%, 65%);
        }
        .video-box {
            background: hsl(0, 0%, 13%);
            border: 1px solid hsl(215, 7%, 33%);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
        }
        .video-title {
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: hsl(216, 12%, 92%);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .qualities-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .quality-btn {
            background: hsl(214, 53%, 26%);
            color: hsl(218, 89%, 73%);
            border: 1px solid hsl(218, 89%, 73%);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s ease;
        }
        .quality-btn:hover {
            background: hsl(218, 89%, 73%);
            color: hsl(0, 0%, 7%);
        }
        .settings-card {
            background: hsl(0, 0%, 11%);
            border: 1px solid hsl(214, 5%, 22%);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: hsl(0, 0%, 80%);
            cursor: pointer;
        }
        .form-row input[type="checkbox"] {
            cursor: pointer;
            accent-color: hsl(218, 89%, 73%);
            width: 16px;
            height: 16px;
        }
        .btn-hub {
            display: block;
            width: 100%;
            padding: 10px;
            background: hsl(218, 89%, 73%);
            color: hsl(0, 0%, 7%);
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.15s ease;
        }
        .btn-hub:hover {
            background: hsl(218, 95%, 80%);
        }
        .msg-toast {
            font-size: 0.78rem;
            color: hsl(140, 37%, 65%);
            text-align: center;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">
            <img src="icon32.png" alt="Nitro DM" style="width: 22px; height: 22px; border-radius: 4px;">
            <span>Nitro DM Pro</span>
        </div>
        <span class="status-badge" id="serverStatus"><span class="status-dot"></span> Online</span>
    </div>

    <!-- Active Video Card -->
    <div id="videoSniffBox" class="video-box" style="display: none;">
        <div class="video-title" id="tabVideoTitle">Detecting video...</div>
        <div class="qualities-grid" id="qualitiesList">
            <!-- Buttons injected by popup.js -->
        </div>
    </div>

    <!-- Features & Preferences -->
    <div class="settings-card">
        <label class="form-row">
            <span>⚡ "Download" button on video:</span>
            <input type="checkbox" id="floatingBtnCheck" checked>
        </label>
        <label class="form-row">
            <span>🔔 Bottom-right completion popup:</span>
            <input type="checkbox" id="notificationsCheck" checked>
        </label>
        <label class="form-row">
            <span>📥 Auto-intercept browser downloads:</span>
            <input type="checkbox" id="interceptCheck">
        </label>
    </div>

    <a href="http://localhost:3000" target="_blank" class="btn-hub">Open Console Hub</a>
    <div id="popupMsg" class="msg-toast"></div>

    <script src="popup.js"></script>
</body>
</html>
